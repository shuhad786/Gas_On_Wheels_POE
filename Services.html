<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/456adb4b31.js" crossorigin="anonymous"></script>
  <title>Services Page</title>
</head>
<body>
  <div class="drop-box-shadow-2 h-fit my-12 mx-12 rounded-sm flex flex-col items-center">
    <div class="mobile-services flex items-end justify-around p-6">
      <div class="flex flex-col">
        <h5 class="text-2xl font-roboto-slab services-ml">Services offered for your convenience</h5>
        <ul class="mt-4">
          <li class="list-none mb-4 text-orange-dark">Gas line installation</li>
          <li class="list-none mb-4 text-orange-dark">Regulator mounting</li>
          <li class="list-none mb-4 text-orange-dark">Bracket for gas tank mounting</li>
          <li class="list-none mb-4 text-orange-dark">Leak detecting</li>
          <li class="list-none mb-4 text-orange-dark">Maintenance service of equipment</li>
          <li class="list-none mb-4 text-orange-dark">Certification</li>
        </ul>
      </div>
      <div class="image-grid-2">
        <img class="lightbox-trigger" src="assets/image 5.png" alt="service 1"/>
        <img class="lightbox-trigger" src="assets/image 6.png" alt="service 2"/>
        <img class="lightbox-trigger" src="assets/image 7.png" alt="service 3"/>
      </div>
    </div>
  </div>
    <!-- Lightbox container -->
  <div id="lightbox" class="lightbox" style="display:none;">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-img" src="" alt="Expanded image" />
  </div>
</body>
</html>
