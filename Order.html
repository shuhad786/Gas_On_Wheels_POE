<!DOCTYPE html>
<html lang="en">
<head>    
  <meta charset="UTF-8">    
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    
  <link rel="stylesheet" href="styles.css">    
  <title>Gas Delivery</title>    
  <script src="script.js" defer></script> 
  <!-- Ensure script is loaded after HTML -->
</head>
<body>
<!-- Order Modal -->
  <div id="orderModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('orderModal')">&times;</span>
      <h2 class="text-4xl font-roboto-slab">Order Form</h2>
      <form action="https://formspree.io/f/xvgbjvnl" method="POST" class="flex flex-col">
        <input name="address" required class="text-sm font-roboto-x-light rounded inset-shadow border-remove w-input h-input px-1" type="text" placeholder="Delivery Address" />
        <input name="name" required class="text-sm font-roboto-x-light rounded inset-shadow border-remove w-input h-input px-1" type="text" placeholder="Your Name" />
        <input name="contact" required class="text-sm font-roboto-x-light rounded inset-shadow border-remove w-input h-input px-1" type="tel" placeholder="Contact Number" />
        <div class="flex flex-col">
          <label class="text-sm font-roboto-x-light">Cylinder Size:</label>
          <label><input type="checkbox" name="cylinderSize" value="9kg"> 9kg</label>
          <label><input type="checkbox" name="cylinderSize" value="14kg"> 14kg</label>
          <label><input type="checkbox" name="cylinderSize" value="19kg"> 19kg</label>
          <label><input type="checkbox" name="cylinderSize" value="48kg"> 48kg</label>
        </div>
        <button class="w-button-3 h-button-3 text-lg bg-orange text-white rounded border-remove" type="submit">Submit Order</button>
      </form>
    </div>
  </div>
</body>
</html>
